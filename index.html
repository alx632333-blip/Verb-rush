<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Verb Rush: гра з Verb Patterns</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#12122a;--arena:#1b1b3d;--ink:#ffffff;--gold:#FFE680;--b:#2F5FEA;--o:#E0560F;--g:#0F8A7E;--p:#D61F6E;--ok:#4ADE80;--bad:#FF6B6B;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito',Arial,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none}
.app{max-width:560px;margin:0 auto;height:100%;display:flex;flex-direction:column;gap:8px;padding:8px 10px}
.hud{display:flex;justify-content:space-between;align-items:center;font-weight:900;font-size:20px;gap:8px}
.hud .sc{font-size:26px;color:var(--gold)}
.pill{background:#2a2a55;border-radius:99px;padding:4px 12px;font-size:16px}
.icon{border:0;background:#2a2a55;color:#fff;border-radius:99px;min-width:44px;min-height:44px;font:inherit;font-weight:900;font-size:15px;cursor:pointer}
.arena{flex:1;min-height:0;position:relative;overflow:hidden;border-radius:24px;background:var(--arena);display:grid;grid-template-columns:repeat(4,1fr)}
.lane{opacity:.22}
.lane:nth-child(1){background:var(--b)}.lane:nth-child(2){background:var(--o)}.lane:nth-child(3){background:var(--g)}.lane:nth-child(4){background:var(--p)}
.floor{position:absolute;left:0;right:0;bottom:0;height:34px;background:repeating-linear-gradient(135deg,#ff6b6b 0 14px,#2a2a55 14px 28px);opacity:.85;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;letter-spacing:2px}
.floor span{background:#12122a;padding:2px 10px;border-radius:99px}
.card{position:absolute;left:50%;top:0;padding:10px 26px;border-radius:22px;background:#fff;color:#12122a;font-weight:900;font-size:46px;box-shadow:0 8px 0 #FFE680,0 12px 24px #0006;white-space:nowrap;will-change:transform}
.card.good{animation:pop .3s forwards}.card.bad{animation:shk .5s forwards}
@keyframes pop{to{opacity:0;transform:var(--t) scale(1.5)}}
@keyframes shk{20%{margin-left:-14px}50%{margin-left:14px}80%{margin-left:-8px}to{opacity:0}}
.toast{position:absolute;left:10px;right:10px;top:10px;border-radius:18px;background:#000b;padding:10px 14px;font-weight:800;font-size:18px;line-height:1.3;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.toast mark{background:var(--gold);color:#12122a;border-radius:7px;padding:0 5px}
.toast .t{display:block;font-size:14px;opacity:.9;margin-top:3px}
.fl{position:absolute;left:50%;font-weight:900;font-size:28px;color:var(--gold);animation:fly .8s forwards;pointer-events:none}
@keyframes fly{to{transform:translateY(-70px);opacity:0}}
.gates{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.gate{border:0;border-radius:18px;min-height:86px;color:#fff;font:inherit;font-weight:900;font-size:21px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 5px 0 #0006;padding:4px}
.gate small{font-size:12px;font-weight:800;opacity:.95}
.gate i{font-style:normal;font-size:11px;background:#0005;border-radius:99px;padding:0 7px;margin-top:2px}
.gate:active,.gate.hit{transform:translateY(4px);box-shadow:0 1px 0 #0006}
.gate.ans{outline:5px solid var(--ok)}
.ov{position:absolute;inset:0;background:#12122af2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;z-index:5}
.ov.hide{display:none}
.ov h1{margin:0;font-size:56px;font-weight:900;color:var(--gold);line-height:1}
.ov p{margin:0;font-weight:800;font-size:19px;line-height:1.4;max-width:420px}
.big{font-size:64px;font-weight:900;color:var(--gold)}
.play{border:0;border-radius:22px;min-height:60px;padding:0 40px;font:inherit;font-weight:900;font-size:26px;background:var(--gold);color:#12122a;cursor:pointer;box-shadow:0 6px 0 #b59a2e}
.mist{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-height:120px;overflow:auto}
.mist span{background:#2a2a55;border-radius:12px;padding:4px 10px;font-weight:800;font-size:15px}
</style>
</head>
<body>
<div class="app">
 <div class="hud">
  <span class="sc" id="sc">0</span>
  <span class="pill" id="lv">Рівень 1</span>
  <span class="pill" id="cb">x1</span>
  <span id="hp"></span>
  <button class="icon" id="mute" aria-label="Звук">Звук</button>
 </div>
 <div class="arena" id="arena">
  <div class="lane"></div><div class="lane"></div><div class="lane"></div><div class="lane"></div>
  <div class="toast" id="toast"></div>
  <div class="floor"><span>ЛІНІЯ ПРОВАЛУ</span></div>
  <div class="ov" id="start">
   <h1>VERB<br>RUSH</h1>
   <p>Дієслова падають! Встигни відправити кожне у правильні ворота, поки воно не торкнулось лінії.</p>
   <p style="font-size:16px;opacity:.85">Клавіші: 1 2 3 4 або A S D F</p>
   <button class="play" id="go">Грати</button>
   <div id="best" style="font-weight:800"></div>
  </div>
  <div class="ov hide" id="over">
   <div style="font-weight:900;font-size:24px">Кінець гри</div>
   <div class="big" id="fs">0</div>
   <p id="fm"></p>
   <div style="font-weight:800;font-size:15px" id="fh">Повтори ці дієслова:</div>
   <div class="mist" id="ms"></div>
   <button class="play" id="again">Ще раз</button>
  </div>
 </div>
 <div class="gates" id="gates"></div>
</div>
<script>
var T={
to:{n:"to →",s:"want to go",c:"var(--b)",tip:"to = стрілка вперед: плани, мрії, рішення"},
ing:{n:"-ing ⟳",s:"enjoy going",c:"var(--o)",tip:"-ing = колесо: звичка, відчуття, процес"},
obj:{n:"+ me to",s:"tell me to go",c:"var(--g)",tip:"спочатку кого (me, him), потім to"},
bare:{n:"NO TO",s:"let me go",c:"var(--p)",tip:"make і let не пускають to"}
};
var K=["to","ing","obj","bare"];
var D=[
["want","to","I <mark>want to be</mark> a YouTuber."],["decide","to","He <mark>decided to buy</mark> new sneakers."],
["hope","to","We <mark>hope to win</mark> the game."],["begin","to","It <mark>began to rain</mark>."],
["start","to","She <mark>started to learn</mark> guitar."],["prefer","to","I <mark>prefer to text</mark>, not call."],
["promise","to","Ann <mark>promised to call</mark> me."],["prepare","to","They <mark>prepared to leave</mark>."],
["happen","to","I <mark>happened to see</mark> him."],
["enjoy","ing","I <mark>enjoy playing</mark> video games."],["fancy","ing","Do you <mark>fancy watching</mark> a film?"],
["miss","ing","I <mark>miss hanging out</mark> with friends."],["imagine","ing","<mark>Imagine living</mark> on Mars!"],
["keep","ing","She <mark>keeps checking</mark> her phone."],["finish","ing","He <mark>finished doing</mark> his homework."],
["tell","obj","Mum <mark>told me to clean</mark> my room."],["ask","obj","Our teacher <mark>asked us to speak</mark> English."],
["invite","obj","Ben <mark>invited me to come</mark> to his party."],["remind","obj","My sister <mark>reminded me to buy</mark> milk."],
["advise","obj","The doctor <mark>advised him to sleep</mark> more."],["convince","obj","I <mark>convinced my dad to buy</mark> a dog."],
["make","bare","Mum <mark>made me tidy</mark> my room."],["let","bare","Dad <mark>let me stay</mark> up late."]
];
var $=function(i){return document.getElementById(i)};
var st="idle",score,lives,streak,correct,level,cur,prog,dur,last,miss,pool,tt,muted=false,ac=null;
function beep(f,l){if(muted)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();var o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.type="square";g.gain.value=.04;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+l)}catch(e){}}
function build(){var h="";K.forEach(function(k,n){h+='<button class="gate" data-k="'+k+'" style="background:'+T[k].c+'">'+T[k].n+'<small>'+T[k].s+'</small><i>'+(n+1)+'</i></button>'});$("gates").innerHTML=h;
 Array.prototype.forEach.call($("gates").children,function(b){b.onpointerdown=function(e){e.preventDefault();answer(b.getAttribute("data-k"))}})}
function hearts(){var s="";for(var k=0;k<3;k++)s+='<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" style="margin-left:2px"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.800-8 11-8 11z" fill="'+(k<lives?'#FF4D79':'#4b4b78')+'"/></svg>';$("hp").innerHTML=s}
function hud(){$("sc").textContent=score;$("lv").textContent="Рівень "+level;$("cb").textContent="x"+mult();hearts()}
function mult(){return 1+Math.min(4,Math.floor(streak/3))}
function shuffle(a){a=a.slice();for(var k=a.length-1;k>0;k--){var j=Math.floor(Math.random()*(k+1)),t=a[k];a[k]=a[j];a[j]=t}return a}
function start(){score=0;lives=3;streak=0;correct=0;level=1;miss=[];pool=[];$("start").classList.add("hide");$("over").classList.add("hide");st="play";hud();spawn();last=performance.now();requestAnimationFrame(loop)}
function spawn(){if(!pool.length)pool=shuffle(D);cur=pool.pop();prog=0;dur=Math.max(2.6,7-correct*.12);
 var c=$("card");if(c)c.remove();c=document.createElement("div");c.id="card";c.className="card";c.textContent=cur[0];$("arena").appendChild(c);
 Array.prototype.forEach.call($("gates").children,function(b){b.classList.remove("ans")});place()}
function place(){var c=$("card");if(!c)return;var H=$("arena").clientHeight-34-c.offsetHeight-14;var y=prog*Math.max(H,10);c.style.setProperty("--t","translate(-50%,"+y+"px)");c.style.transform="translate(-50%,"+y+"px)"}
function loop(t){if(st!=="play")return;var dt=Math.min(.05,(t-last)/1000);last=t;prog+=dt/dur;place();if(prog>=1){fail("Не встиг!")}else requestAnimationFrame(loop)}
function toast(h,t){var e=$("toast");e.innerHTML=h+'<span class="t">'+t+'</span>';e.classList.add("on");clearTimeout(tt);tt=setTimeout(function(){e.classList.remove("on")},2200)}
function fly(txt){var f=document.createElement("div");f.className="fl";f.textContent=txt;f.style.top=($("arena").clientHeight*.55)+"px";f.style.marginLeft="-30px";$("arena").appendChild(f);setTimeout(function(){f.remove()},800)}
function answer(k){if(st!=="play")return;
 if(k===cur[1]){st="wait";var p=10*mult();score+=p;streak++;correct++;level=1+Math.floor(correct/5);beep(660,.08);beep(880,.1);fly("+"+p);
  var c=$("card");c.classList.add("good");toast(cur[2],T[k].tip);hud();setTimeout(function(){st="play";spawn();last=performance.now();requestAnimationFrame(loop)},320)}
 else fail("Ні! Правильно: "+T[cur[1]].n,k)}
function fail(msg,k){if(st==="over")return;st="wait";lives--;streak=0;miss.push(cur);beep(160,.3);
 var c=$("card");if(c)c.classList.add("bad");
 Array.prototype.forEach.call($("gates").children,function(b){if(b.getAttribute("data-k")===cur[1])b.classList.add("ans")});
 toast("<b>"+msg+"</b><br>"+cur[2],T[cur[1]].tip);hud();
 if(lives<=0){setTimeout(end,1500)}else setTimeout(function(){st="play";spawn();last=performance.now();requestAnimationFrame(loop)},1400)}
function end(){st="over";var b=0;try{b=+(localStorage.getItem("vr-best")||0);if(score>b){b=score;localStorage.setItem("vr-best",b)}}catch(e){}
 $("fs").textContent=score;$("fm").textContent=score>=300?"Легенда Verb Patterns!":score>=150?"Дуже круто! Ще раунд?":"Добра розминка. Спробуй побити рекорд!";
 var u={};miss.forEach(function(d){u[d[0]]=d});var ks=Object.keys(u);
 $("fh").classList.toggle("hide",!ks.length);$("ms").innerHTML=ks.map(function(v){return "<span>"+v+" → "+T[u[v][1]].n+"</span>"}).join("");
 $("over").classList.remove("hide");var c=$("card");if(c)c.remove()}
document.addEventListener("keydown",function(e){var m={"1":"to","2":"ing","3":"obj","4":"bare","a":"to","s":"ing","d":"obj","f":"bare"};var k=m[e.key.toLowerCase()];
 if(k){answer(k);var i=K.indexOf(k),g=$("gates").children[i];g.classList.add("hit");setTimeout(function(){g.classList.remove("hit")},120)}});
$("go").onclick=start;$("again").onclick=start;
$("mute").onclick=function(){muted=!muted;$("mute").textContent=muted?"Тихо":"Звук"};
window.addEventListener("resize",place);
build();lives=3;score=0;level=1;streak=0;hud();
try{var bb=localStorage.getItem("vr-best");if(bb)$("best").textContent="Рекорд: "+bb}catch(e){}
</script>
</body>
</html>
